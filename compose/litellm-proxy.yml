# AI Workstation - LiteLLM + Ollama + Open WebUI joint deployment
# Shows how the three services work together: LiteLLM is the unified API
# gateway, Ollama serves the local models, and Open WebUI points at LiteLLM
# (not directly at Ollama) so all requests go through the gateway with key
# management and budget control.
# Part of the 0x10debug VPS tool suite
#
# Hardening summary:
#   - All ports bound to 127.0.0.1 only — expose via reverse proxy with auth
#   - Pinned image tags (no floating `latest`)
#   - Healthchecks on every service
#   - restart: unless-stopped + log rotation
#   - GPU access gated behind the `gpu` compose profile (opt-in)
#
# Usage (CPU):
#   docker compose -f compose/litellm-proxy.yml --profile cpu \
#       --env-file compose/.env up -d
#
# Usage (GPU):
#   docker compose -f compose/litellm-proxy.yml --profile gpu \
#       --env-file compose/.env up -d
#
# The `mb ai litellm deploy --full` wrapper selects the profile for you.
#
# Request flow:
#   client -> LiteLLM :4000 (OpenAI-compatible /v1/*)
#                   -> Ollama :11434 (model inference)
#   Open WebUI -> LiteLLM :4000 (OLLAMA_BASE_URL=http://litellm:4000)
#             -> Ollama :11434 (via LiteLLM routing)

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}

volumes:
  ollama-models:
  open-webui-data:
  litellm-config:

x-ollama-common: &ollama-common
  image: ollama/ollama:0.3.14
  container_name: ollama
  restart: unless-stopped
  ports:
    - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
  volumes:
    - ollama-models:/root/.ollama
  environment:
    OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    OLLAMA_MAX_VRAM: ${OLLAMA_MAX_VRAM:-0}
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/version || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: ${OLLAMA_MEMORY_LIMIT:-16g}

services:
  # ---- Ollama (CPU) ----
  ollama:
    <<: *ollama-common
    profiles:
      - cpu
    networks:
      - mb-proxy

  # ---- Ollama (GPU) ----
  ollama-gpu:
    <<: *ollama-common
    profiles:
      - gpu
    networks:
      mb-proxy:
        aliases:
          - ollama
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-16g}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # ---- LiteLLM API gateway ----
  # Sits in front of Ollama and exposes an OpenAI-compatible API on :4000.
  # All programmatic clients (and Open WebUI below) talk to LiteLLM, not
  # directly to Ollama, so routing, keys, and budgets are centralized.
  litellm:
    image: ghcr.io/berriai/litellm:v1.52.0
    container_name: litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - litellm-config:/app/litellm-data
    environment:
      OLLAMA_API_BASE: http://ollama:11434
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-litellm-salt-change-me}
      CONFIG_FILE_PATH: /app/config.yaml
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
    networks:
      - mb-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Open WebUI ----
  # Points at LiteLLM instead of Ollama directly. This means chat traffic also
  # flows through the gateway, so you get unified logging, key tracking, and
  # budget enforcement for interactive use, not just API calls.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.4.8
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Route through LiteLLM instead of hitting Ollama directly.
      OLLAMA_BASE_URL: http://litellm:4000
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      WEBUI_NAME: ${WEBUI_NAME:-AI Workstation}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
    networks:
      - mb-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
