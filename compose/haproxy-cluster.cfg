# HAProxy configuration for Ollama cluster load balancing
# Generated by mb ai cluster deploy — placed at compose/haproxy-cluster.cfg
#
# Strategy: leastconn (send request to the instance with fewest active connections)
# Health check: HTTP GET /api/version every 5s, 3 consecutive failures = down
# Fallback: if all backends are down, return 503

global
    log stdout format raw local0
    maxconn 100
    stats socket /tmp/haproxy.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    timeout http-keep-alive 10s

# Stats endpoint (accessible only from localhost)
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s

# Ollama cluster frontend
frontend ollama_cluster
    bind *:11434
    mode http
    option http-buffer-request
    # Increase buffer for large model prompts
    timeout http-request 60s
    default_backend ollama_instances

# Ollama instances backend
backend ollama_instances
    mode http
    balance leastconn
    option httpchk GET /api/version
    http-check expect status 200
    default-server inter 5s fall 3 rise 2
    # Sticky sessions via cookie (optional, uncomment for model affinity)
    # cookie OLLAMA_INSTANCE insert indirect nocache
    server ollama-1 ollama-1:11434 check
    server ollama-2 ollama-2:11434 check
    server ollama-3 ollama-3:11434 check backup
    # The third server is marked backup — only used when 1 or 2 is down
    # Remove 'backup' if you want all 3 active simultaneously
