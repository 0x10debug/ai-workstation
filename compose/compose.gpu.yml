# AI Workstation - GPU deployment
# Ollama + Open WebUI on NVIDIA GPU VPS
# Part of the 0x10debug VPS tool suite
#
# The ollama/ollama:latest image auto-detects NVIDIA GPUs when the
# nvidia-container-toolkit is installed and devices are reserved below.
#
# Usage:
#   docker compose -f compose/compose.gpu.yml --env-file compose/.env up -d

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - /data/ollama:/root/.ollama
    networks:
      - mb-proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - /data/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - mb-proxy
