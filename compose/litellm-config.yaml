# LiteLLM routing configuration
# Consumed by compose/litellm.yml (mounted at /app/config.yaml).
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# This file routes OpenAI-compatible requests to the local Ollama service.
# Generate a master key and salt before deploying:
#   openssl rand -hex 32   # -> LITELLM_MASTER_KEY (in compose/.env)
#   openssl rand -hex 32   # -> LITELLM_SALT_KEY   (in compose/.env)

# ---- Model list ----
# Each entry maps a LiteLLM model name (what clients request) to a backend.
# `litellm_params.provider` = "ollama" tells LiteLLM to use the Ollama adapter.
# `litellm_params.api_base` is read from the OLLAMA_API_BASE env var set in the
# compose file; you can also hard-code http://ollama:11434 here.
model_list:
  # Chat models — clients call these by `model:` name.
  - model_name: llama3.2:3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434

  - model_name: qwen2.5:7b
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434

  # Embedding model — used by RAG pipelines and Open WebUI retrieval.
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

  # ---- Load balancing: multiple Ollama instances ----
  # To round-robin across two Ollama hosts, list the same `model_name` twice
  # with different `api_base` values. LiteLLM's `router_settings` below
  # controls the selection strategy.
  #
  # - model_name: llama3.2:3b
  #   litellm_params:
  #     model: ollama/llama3.2:3b
  #     api_base: http://ollama-2:11434

  # ---- External providers (commented examples) ----
  # Uncomment and set the relevant API key in compose/.env to add cloud models.
  # Clients keep using the same /v1/chat/completions endpoint; LiteLLM routes
  # based on the `model:` field.
  #
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #
  # - model_name: claude-3-5-sonnet
  #   litellm_params:
  #     model: anthropic/claude-3-5-sonnet-20241022
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #
  # - model_name: gemini-2.0-flash
  #   litellm_params:
  #     model: gemini/gemini-2.0-flash
  #     api_key: os.environ/GEMINI_API_KEY

# ---- Router settings ----
# Controls how LiteLLM picks a backend when a model_name has multiple entries.
#   simple-shuffle  — random pick (default, good for round-robin)
#   least-busy      — pick the deployment with the fewest in-flight requests
#   latency-based-routing — pick the lowest-latency deployment
#   usage-based-routing   — pick by cost/token budgets
router_settings:
  routing_strategy: simple-shuffle

# ---- LiteLLM settings ----
litellm_settings:
  # Drop unsupported params instead of erroring when a client sends OpenAI-only
  # fields that Ollama doesn't understand. Keeps compatibility high.
  drop_params: true
  # Global budget (USD) across all virtual keys. 0 = no global cap.
  # Set per-key budgets in general_settings.virtual_keys below.
  max_budget: ${LITELLM_MAX_BUDGET:-0}
  # Budget reset window: "daily", "weekly", or "monthly".
  budget_duration: ${LITELLM_BUDGET_DURATION:-monthly}
  # Telemetry — off by default for privacy. Enable only if you opt in.
  telemetry: false

# ---- General settings ----
general_settings:
  # Master key pulled from the environment (set LITELLM_MASTER_KEY in .env).
  # The master key can call any model and mint virtual keys.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Salt for hashing virtual keys before storage.
  database_url: os.environ/DATABASE_URL
  # Optional: enforce that every request carries a valid key.
  enforce_user_config: false

  # ---- Virtual API keys (budget-controlled) ----
  # Create keys at runtime via the /key/generate endpoint with the master key,
  # or pre-declare them here. Each key can have its own model list and budget.
  # Example (uncomment and replace the key hash):
  #
  # virtual_keys:
  #   - key_name: team-chat
  #     key_alias: team-chat-key
  #     max_budget: 10.0          # USD per budget_duration
  #     budget_duration: monthly
  #     models: ["llama3.2:3b", "qwen2.5:7b"]
  #     # key: sk-team-...        # generated by LiteLLM on first start
