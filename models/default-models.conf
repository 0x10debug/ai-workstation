# Default model preload list for the AI Workstation production deployment
# Used by: scripts/preload-models.sh  (and `mb ai ollama-prod preload`)
#
# Format: one Ollama tag per line. Lines starting with # and blank lines are
# ignored. Edit this file to change what `mb ai ollama-prod preload` installs
# on a fresh VPS.
#
# Columns below are documentation only — the script reads just the tag (first
# token of each non-comment line). Keep tags as the only token on their line.

# ---- Chat / general purpose ----
# llama3.2:3b — ~2GB, Meta Llama 3.2 3B. Balanced CPU model; good first model
# to verify the stack. Fits in 4GB+ RAM. Instruct-tuned.
llama3.2:3b

# qwen2.5:7b — ~4.7GB, Alibaba Qwen 2.5 7B. Strong multilingual (zh/ja/ko/eu)
# reasoning. Needs 8GB+ RAM/VRAM. Excellent general-purpose model.
qwen2.5:7b

# ---- Embeddings (required for RAG) ----
# nomic-embed-text — ~270MB, Nomic embedding model. Used by Open WebUI RAG
# (Chroma vector store). Small and fast; pull whenever RAG is enabled.
nomic-embed-text
