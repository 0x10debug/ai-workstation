name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-syntax:
    name: bash -n syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: bash -n all shell scripts and the mb entrypoint
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          bash -n mb
          echo "bash -n: all scripts pass"

  shellcheck:
    name: shellcheck (warning gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck gate
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 shellcheck -S warning
          shellcheck -S warning mb
          echo "shellcheck gate: no error or warning level findings"

  compose-config:
    name: compose file validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every compose file
        run: |
          count=0
          fail=0
          while IFS= read -r -d '' f; do
            if docker compose -f "$f" config -q 2>/dev/null; then
              echo "OK $f"
              count=$((count + 1))
            else
              echo "FAIL $f"
              fail=$((fail + 1))
            fi
          done < <(find . \( -name '*.yml' -o -name '*.yaml' \) -path './compose/*' -not -path './.git/*' -print0)
          echo "compose config: $count valid, $fail failed"
          [ "$fail" -eq 0 ]

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  content-policy:
    name: no-Chinese content policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for CJK characters and fullwidth punctuation
        run: |
          if grep -rIPn '[\x{3000}-\x{303F}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}\x{FE30}-\x{FE4F}\x{FF00}-\x{FFEF}]' --exclude-dir=.git .; then
            echo "::error::Chinese characters or fullwidth punctuation found - no-Chinese policy violation"
            exit 1
          fi
          echo "no-Chinese policy: clean"
