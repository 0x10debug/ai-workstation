# AI Workstation - RAG (Retrieval-Augmented Generation) components
# Adds Chroma vector database and configures Open WebUI RAG settings.
# Part of the 0x10debug VPS tool suite
#
# Usage (via mb CLI):
#   mb ai rag setup
#
# Manual usage:
#   docker compose -f rag/rag-compose.yml --env-file compose/.env up -d

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - mb-proxy

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - /data/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # ---- RAG settings ----
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_DB_URL=http://chroma:8000
      - RAG_DOCUMENT_MAX_CHARS=10000
      - RAG_TOP_K=4
    depends_on:
      - chroma
    networks:
      - mb-proxy
